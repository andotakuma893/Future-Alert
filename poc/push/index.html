<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Future Alert Push PoC</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FA PoC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Future Alert Push PoC</h1>
    <p class="note">フェーズ0の通知検証用ページです。本番UIではありません。</p>

    <section>
      <h2>環境</h2>
      <dl id="env"></dl>
      <p id="hint" class="hint" hidden>
        iPhoneでは、Safariの共有ボタンから「ホーム画面に追加」し、ホーム画面のアイコンから開いてください。
      </p>
    </section>

    <section>
      <h2>操作</h2>
      <button id="btn-permission" type="button">1. 通知を許可する</button>
      <button id="btn-subscribe" type="button">2. 通知を購読する</button>
      <button id="btn-local" type="button" class="secondary">端末内テスト通知（サーバー不要）</button>
      <button id="btn-unsubscribe" type="button" class="secondary">購読を解除する</button>
      <button id="btn-refresh" type="button" class="secondary">状態を再読み込み</button>
    </section>

    <section>
      <h2>Push Subscription</h2>
      <p class="note">
        Renderの無料プランでは再起動時にサーバー側の購読情報が消える可能性があります。
        数時間後テストの前に、この内容をパソコン側に控えておくと管理画面から直接送信できます。
      </p>
      <textarea id="sub-json" readonly rows="6" placeholder="未購読"></textarea>
      <button id="btn-copy" type="button" class="secondary">コピー</button>
    </section>

    <section>
      <h2>ログ</h2>
      <pre id="log"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
